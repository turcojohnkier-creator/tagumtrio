services:
  - type: web
    name: tagumtrio-backend
    runtime: python
    rootDir: tagumtrio-back
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tagumtrio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BACKEND_CORS_ORIGINS
        sync: false

databases:
  - name: tagumtrio-db
    plan: free
