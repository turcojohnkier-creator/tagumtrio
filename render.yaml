services:
  - type: web
    name: tagumtrio-backend
    runtime: python
    rootDir: tagumtrio-back
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      # Supabase Session pooler URI, set in the Render dashboard:
      # postgresql+psycopg://postgres.<ref>:<password>@<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: BACKEND_CORS_ORIGINS
        sync: false
